hero:
  eyebrow: "Schulprogramm · Lesekultur · Sek I"
  title: "Lesekultur"
  titleHighlight: "fordern und fördern"
  lede: "Lesen ist an der UNESCO-Schule Essen Schlüssel zu eigenem Denken, vertiefter Bildung und kultureller Teilhabe. Wir fordern und fördern zugleich: anspruchsvolle Lektüren, eigene Buchpräsentationen und Begegnungen mit Autorinnen und Autoren stehen neben der Freude am Lesen, dem Eintauchen in fremde, fantastische und neue Welten. Schritt für Schritt führen wir so an die literarische Arbeit der Oberstufe heran."
  image: ""
  imageAlt: ""

quote:
  text: "Von allen Welten, die der Mensch erschaffen hat, ist die der Bücher die Gewaltigste."
  author: "Heinrich Heine"

bausteine:
  eyebrow: "01 · Bausteine nach Jahrgangsstufen"
  title: "Fordern und Fördern, Schritt für Schritt"
  body: ""
  list:
    - klasse: "Klassen 5 und 6"
      mark: "Lust am Lesen wecken"
      bullets:
        - "**Lesenachmittage** in der Schule: gemeinsames Vorlesen, Buchempfehlungen und kleine Mitmachformate."
        - "Teilnahme am bundesweiten **Vorlesewettbewerb** in Klasse 6."
        - "**Besuch der Stadtbibliothek Essen**: Bibliotheksführung, Recherche- und Ausleihroutine."
        - "Systematischer Aufbau **lesestrategischer Methoden** und Texterschließung im Deutschunterricht."
    - klasse: "Klassen 7 und 8"
      mark: "Tiefer lesen, kritischer verstehen"
      bullets:
        - "**Buchpräsentationen** in der Reihe „Einen Jugendroman lesen und verstehen\". Jede Schülerin und jeder Schüler stellt einen selbst gewählten Roman vor."
        - "Projekt **„Zeitschriften in die Schulen\"**: bundesweites Programm der Stiftung Lesen."
        - "In Kooperation mit **lit.COLOGNE und lit.RUHR**: Lesungen mit Autorinnen und Autoren von Jugendbüchern."
        - "**Thalia #lassmalesen-Büchertisch** als kuratierte Empfehlungsübersicht."
    - klasse: "Klassen 9 und 10"
      mark: "Lesen als Haltung"
      bullets:
        - "Fortführung des Programms **„Zeitschriften in die Schulen\"** mit stärkerem Fokus auf Sachtexten, Reportage und Recherche."
        - "**Thalia #lassmalesen-Büchertisch** als kuratierte Empfehlungsplattform für eigene Buchwahl in Lektürephasen und Projekten."
        - "Hinführung zur anspruchsvollen literarischen Arbeit der Oberstufe: Genre-Vielfalt, kritisches Lesen, Verbindung von Literatur und Gegenwart."

beyond:
  eyebrow: "02 · Über das Pflichtprogramm hinaus"
  title: ""
  cards:
    - title: "Offener Bücherschrank auf dem Schulhof"
      body: "Auf dem Schulhof steht den Schülerinnen und Schülern ein offener Bücherschrank mit einer Vielzahl von Jugendbüchern für verschiedene Altersstufen zur Verfügung. Lesen darf hier spätestens in der Pause beginnen. Ein freier Zugang zu Geschichten, ohne Anmeldung, ohne Note."
    - title: "Vernetzt im Stadtteil und in der Region"
      body: "Lesekultur lebt von Partnerinnen und Partnern: die **Stadtbibliothek Essen** als verlässlicher Lernort, die **Stiftung Lesen** als bundesweites Programm, **lit.COLOGNE und lit.RUHR** als Festivals, dazu Buchhandlungen und Verlage als Impulsgeber. Diese Vernetzung macht Lesen für unsere Schülerinnen und Schüler greifbar und zeigt, dass Literatur ein gesellschaftlicher Ort ist."

verantwortung:
  eyebrow: "Verantwortlich"
  title: "Beauftragte für Leseförderung"
  body: "Anregungen, Rückfragen und Ideen sind herzlich willkommen. Schreiben Sie gerne direkt an die Beauftragte für Leseförderung in der Sekundarstufe I."

download:
  eyebrow: "Vollständiges Konzept"
  title: "Konzept als PDF"
  body: "Das vollständige Konzept zum Mitnehmen oder Ausdrucken: drei Seiten."
  fileLabel: "PDF · 84 KB · Stand Vers02"
  fileHref: "assets/Lesefoerderung-Vers02.pdf"

closing:
  eyebrow: "Lesen verbindet Welten."
  title: "Anspruch und"
  titleHighlight: "Freude am Lesen"
  body: "Lesekompetenz ist Grundlage jeder höheren Bildung und zugleich Einladung in fremde, fantastische, neue Welten. Mit gezieltem Fordern und Fördern in jeder Jahrgangsstufe halten wir beides zusammen."
