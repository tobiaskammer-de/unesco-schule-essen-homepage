path:
  title: "Dein Weg zu uns"
  intro: "Kommen Sie vorbei, schreiben Sie uns oder rufen Sie einfach an."
  cards:
    - kicker: "Tag der offenen Tür"
      bigDate: "05.12.2026"
      bigDateSub: |-
        Samstag, 10:00 – 14:00 Uhr
        Steinmetzstraße 9, 45139 Essen
      text: "Unterricht zum Mitmachen, Gespräche mit Lehrkräften, Schülerinnen und Schülern, Führungen durch die Naturwissenschafts- und Kunsträume. Eine Anmeldung ist nicht nötig."
      ctaLabel: "Programm und Details"
      ctaHref: "Tag-der-offenen-Tuer.html"
    - kicker: "Elterninformationsabend · Klasse 5"
      bigDate: "18.11.2026"
      bigDateSub: |-
        Mittwoch, 19:00 Uhr
        Aula der UNESCO-Schule Essen
      text: "Ihr Kind kommt 2027 in die 5. Klasse? Erfahren Sie als Erste, wie der Start am Gymnasium gelingt — bei unserem Elterninformationsabend zur Erprobungsstufe, noch vor dem großen Andrang zum Tag der offenen Tür. Wir bitten um kurze Anmeldung."
      ctaLabel: "Jetzt informieren"
      ctaHref: "elterninformationsabend-5-klasse-essen.html"
    - kicker: "Fragen stellen"
      title: "Gespräch vereinbaren"
      text: "Ob Schulwahl, Schnuppertag für Ihr Kind oder Fragen zu unserem UNESCO-Profil: Nutzen Sie unser Kontaktformular."
      ctaLabel: "Termin anfragen"
      ctaHref: "Kontakt.html"

partners:
