hero:
  eyebrow: "Über Uns · Gemeinschaft & Netzwerk"
  title: "Mit wem wir"
  titleHighlight: "zusammenarbeiten"
  lede: "Schule funktioniert nicht allein. Unsere Kooperationen reichen von weltweiten Netzwerken bis zu Essener Institutionen — und machen vieles von dem möglich, was unseren Alltag prägt."

intro:
  title: "Partner,"
  titleHighlight: "auf die wir bauen"
  body: |
    Feste Kooperationen tragen unser Schulprofil: das UNESCO-Netzwerk, die Universität Duisburg-Essen, Kultureinrichtungen wie die Theater und Philharmonie Essen sowie Stiftungen und Service-Clubs, die Projekte finanziell ermöglichen.

    Dazu kommen Essener Institutionen aus Sozialarbeit, Medien, Justiz und Berufsorientierung. Auf dieser Seite haben wir sie sortiert, damit man sieht, wer uns in welchem Bereich begleitet.

categories:
  - label: "Netzwerk & Bildungsauftrag"
    intro: "Verbände und Organisationen, in deren Auftrag wir unseren Bildungsauftrag verstehen und weitertragen."
    items:
      - name: "UNESCO-Projektschulen"
        url: "https://www.unesco.de/bildung/unesco-projektschulen"
        logo: "assets/partners/unesco.png"
        desc: "Als eine von rund 300 deutschen UNESCO-Projektschulen sind wir Teil eines weltweiten Netzwerks, verpflichtet auf Frieden, Menschenrechte, kulturelle Vielfalt und nachhaltige Entwicklung."
  - label: "Hochschule & Studienorientierung"
    intro: "Mit wem wir zusammenarbeiten, wenn es um den Übergang in Studium und Beruf geht."
    items:
      - name: "Universität Duisburg-Essen"
        url: "https://www.uni-due.de"
        logo: "assets/partners/uni-due.png"
        desc: "UniTrainees-Programm, Studienfeld-Eignungstests, Talentscouting und regelmäßige Informationsveranstaltungen direkt bei uns vor Ort."
      - name: "Agentur für Arbeit Essen"
        url: "https://www.arbeitsagentur.de/vor-ort/essen/startseite"
        logo: "assets/partners/agentur-arbeit.png"
        desc: "Berufsorientierung, Beratungstermine in Klasse 10 und der Sekundarstufe II sowie die Veranstaltungsreihe „Wege ins Berufsleben\"."
  - label: "Digitale & MINT-Bildung"
    intro: "Partner, die unsere Schülerinnen und Schüler beim Programmieren, Forschen und Gestalten begleiten."
    items:
      - name: "TUMO Essen"
        url: "https://tumo.de/essen"
        logo: ""
        desc: "Außerschulischer Lernort für digitales Gestalten und Coding. Über die Kooperation rund um die Hacker School erhalten unsere Schülerinnen und Schüler Zugänge zu Workshops in Programmierung, Animation, Robotik und Mediengestaltung."
  - label: "Kultur"
    intro: "Unsere Partner für kulturelle Bildung, von der Oper bis zum Schauspiel."
    items:
      - name: "Theater und Philharmonie Essen"
        url: "https://www.theater-essen.de"
        logo: "assets/partners/tup.png"
        desc: "Offizielle Kooperationspartnerschaft: aktuelle Opernproduktion mit über 40 Schülerinnen und Schülern und den Essener Philharmonikern."
      - name: "Folkwang Musikschule"
        url: "https://www.folkwang-musikschule.de"
        logo: ""
        desc: "Musikalische Kooperation rund um den JamTruck: gemeinsame Workshops, Bandprojekte und Auftrittsformate, die Schülerinnen und Schüler ans aktive Musizieren heranführen."
  - label: "Gemeinschaft vor Ort"
    intro: "Essener Partner, mit denen wir im Stadtteil und darüber hinaus Schule leben."
    items:
      - name: "Jugendhilfe Essen"
        url: "https://www.jugendhilfe-essen.de"
        logo: "assets/partners/jhe.png"
        desc: "Partner u.a. bei der Pop-Up-Ausstellung „Nur ein Bild!?\" und weiteren kulturell-politischen Projekten."
      - name: "Amtsgericht Essen"
        url: "https://www.ag-essen.nrw.de"
        logo: ""
        desc: "Kooperation für gelebte politische und juristische Bildung: Gerichtsverhandlungen als Lernort, Begegnung mit Richterinnen und Richtern, Einblicke in das Rechtssystem unserer Demokratie."
      - name: "CSE"
        url: "https://www.cse.de"
        logo: "assets/partners/cse.png"
        desc: "Kooperation im Bereich Ausbildung, Berufsorientierung und Nachhaltigkeit."
      - name: "WDR"
        url: "https://www.wdr.de"
        logo: "assets/partners/wdr.png"
        desc: "Medienbildung und Zusammenarbeit bei dokumentarischen Schulprojekten."
  - label: "Internationale Schulpartnerschaften"
    intro: "Über das Erasmus+-Programm besuchen unsere Schülerinnen und Schüler ihre Partnerschulen in Europa jährlich vor Ort."
    items:
      - name: "Erasmus+ Schulpartnerschaft Tallinn"
        url: ""
        logo: ""
        desc: "Partnerschule in Tallinn (Estland). Jährlicher Schulbesuch unserer Schülerinnen und Schüler im Rahmen des Erasmus+-Programms. Verantwortlich: Frau Hödel und Herr Rockensüß-Köln."

cta:
  eyebrow: "Interesse an einer Kooperation?"
  title: "Gemeinsam"
  titleHighlight: "mehr bewegen"
  body: "Wenn Sie als Institution, Stiftung oder Unternehmen eine Kooperation mit uns aufbauen möchten: Wir freuen uns auf Ihre Nachricht. Die besten Kooperationen entstehen dort, wo sich beide Seiten engagieren."
