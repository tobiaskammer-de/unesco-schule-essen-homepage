hero:
  eyebrow: "Angebote · Beratung & Mitbestimmung"
  title: "Studien- und"
  titleHighlight: "Berufsorientierung"
  lede: "Schule bereitet auf das Berufsleben vor. Wir geben Schülerinnen und Schülern über viele Jahre hinweg einen Überblick über berufliche Möglichkeiten und beraten bei Bedarf individuell."

intro:
  title: "Der Weg entsteht"
  titleHighlight: "beim Gehen"
  body: |
    Zwischen Grundschule und Universität liegt ein Bildungsweg voller Regeln, Vorgaben und Entscheidungen. Für Schülerinnen, Schüler und Eltern ist es oft schwierig, dabei den Überblick zu behalten, zumal Bildungswege nicht immer geradlinig verlaufen.

    Deshalb begleiten wir systematisch: mit altersgerechten Angeboten in den Klassen 8 bis 10, intensiver Orientierung in der Oberstufe und persönlicher Laufbahnberatung, wann immer sie gebraucht wird.

laufbahn:
  kicker: "Wenn's individuell wird"
  title: "Individuelle Laufbahnberatung"
  body: "Der Weg von der Grundschule in die Universität ist von zahlreichen Gesetzen und Vorgaben geregelt. Für Schüler und Eltern ist es oft schwierig, einen Überblick über alle Regelungen zu erhalten und die bestmöglichen Optionen zu wählen. Hier hilft persönliche Beratung, auch wenn der Weg einmal nicht idealtypisch verläuft."
  contactRoom: "Oberstufenbüro · Raum 104"

stufen:
  eyebrow: "Was wann passiert"
  title: "Orientierung in Sek I und Sek II"
  body: "Zwei Phasen mit klar unterschiedlichen Zielen: In der Sekundarstufe I legen wir die Grundlage. In der Sekundarstufe II wird's konkret: Studium, Ausbildung, duales Modell."
  cards:
    - label: "Sekundarstufe I"
      title: "Potenziale erkennen"
      when: "Klassen 8 bis 10"
      items:
        - "**Klasse 8:** Online-Tool BOaktiv (ab Schuljahr 2026/27)."
        - "**Klasse 9:** Potenzialanalyse (Einstiegsinstrument), Berufsfelderkundungen (3 Tage in Betrieben), Schülerbetriebspraktikum (2 Wochen), Planspiel „Spiel des Lebens\" und Anschlussvereinbarung."
        - "**Klasse 10:** Beratungstermine für Schulabgängerinnen und Schulabgänger mit der Arbeitsagentur Essen; IHK-Kooperation „Auszubildende als Werbebotschafter\"."
        - "**Alle Klassen:** Girls' und Boys' Day."
        - "**Kooperation:** Kreishandwerkerschaft Essen, Angebote für die Klasse 9 und die IVK."
    - label: "Sekundarstufe II"
      title: "Konkret werden"
      when: "EF · Q1 · Q2"
      items:
        - "**EF:** Zweiwöchiges Pflichtpraktikum."
        - "**Q1:** Teilnahme an der Ausbildungsoffensive."
        - "**Q2:** Besuch von Ausbildungs- und Studienmessen."
        - "**Beratung:** Anschlussvereinbarung; wöchentliche Beratungsangebote der Jugendberufsagentur (JBA)."
        - "**Begabtenförderung & Studienorientierung:** Talentscouting der Universität Duisburg-Essen."

angebot:
  eyebrow: "Beratungsangebot"
  title: "Wer berät zu welchem Thema?"
  cards:
    - label: "Schullaufbahn"
      title: "Individuelle Laufbahnberatung"
      body: "Wege durch das Schulsystem, Fächerwahl, Übergänge, Wiederholung oder Wechsel: persönliche Orientierung, wenn Entscheidungen anstehen."
      href: "#laufbahn"
      cta: "Zur Laufbahnberatung →"
    - label: "Studium & Beruf"
      title: "Studien- und Berufsberatung"
      body: "Falk Lindemann, Studien- und Berufsberater, begleitet bei Studienwahl, Bewerbung und Übergängen. Sein TaskCards-Board bündelt aktuelle Termine und Hilfen für Schülerinnen und Schüler."
      href: "#falk-lindemann"
      cta: "Zu Falk Lindemann →"
    - label: "Uni-Übergang"
      title: "Talentscout"
      body: "Sarah Schröter von der Universität Duisburg-Essen begleitet besonders Jugendliche ohne akademische Wurzeln auf dem Weg ins Studium: kostenfrei, vor Ort, langfristig."
      href: "#talentscout"
      cta: "Zum Talentscout →"

