hero:
  eyebrow: "Profil · Sprachen"
  title: "Drei Sprachen,"
  titleHighlight: "neun Schuljahre."
  lede: "Englisch ab Klasse 5, eine zweite Fremdsprache ab Klasse 7, eine dritte ab Klasse 9 — Sprachen sind bei uns kein Beifach, sondern ein durchgängiger Bestandteil der Schulzeit."
  image: "assets/sp-weltoffen.jpg"
  imageAlt: "Schülerinnen und Schüler im Sprachunterricht"

intro:
  eyebrow: "01 · Englisch ab Klasse 5"
  title: "Vor Grammatik kommt"
  titleHighlight: "das Sprechen."
  body: |
    Englisch beginnt am ersten Schultag und läuft bis zum Abitur durch. Schwerpunkt im Unterricht: Hörverstehen, freie Rede, eigene Texte.

journey:
  eyebrow: "02 · Sprachenfolge"
  title: "Drei Wege durch die Sprachen."
  body: "Die Pflicht-Sprache Englisch wird ab Klasse 7 um eine zweite Fremdsprache ergänzt. Wer Latein wählt, kann ab Klasse 9 zusätzlich Französisch belegen — und mit drei Schulsprachen ins Abitur gehen."
  stages:
    - klasse: "Ab Klasse 5"
      mark: "Pflicht"
      title: "Englisch"
      body: "Pflichtfach für alle, durchgängig von Klasse 5 bis zum Abitur. In der Sekundarstufe I drei bis fünf Wochenstunden je Schuljahr."
    - klasse: "Ab Klasse 7"
      mark: "Wahl"
      title: "Französisch"
      body: "Lebende Sprache. Im Rahmen unserer Erasmus+-Aktivitäten besteht Kontakt zu unserer französischen Partnerschule, dem Lycée Professionnel Léonard de Vinci."
    - klasse: "Ab Klasse 7"
      mark: "Wahl"
      title: "Latein"
      body: "Für Schülerinnen und Schüler, die auf Struktur und Genauigkeit setzen. Möglichkeit, am Ende der Mittelstufe das Latinum zu erwerben — Voraussetzung für Studienfächer wie Medizin, Jura oder Theologie."
    - klasse: "Ab Klasse 9"
      mark: "Erweiterung"
      title: "Französisch als 3. Fremdsprache"
      body: "Latein-Schülerinnen und Schüler können zusätzlich Französisch belegen und mit drei Schulsprachen ins Abitur gehen."

oberstufe:
  eyebrow: "03 · Anfängerkurse in der Oberstufe"
  title: "Auch Quereinsteiger"
  titleHighlight: "schaffen die 2. Fremdsprache."
  body: "In der Einführungsphase (EF) bieten wir Anfängerkurse in Französisch und Latein. Damit können Schülerinnen und Schüler aus anderen Schulformen die zweite Fremdsprache nachholen, die für das Abitur Pflicht ist."

experience:
  eyebrow: "04 · Sprache erleben"
  title: "Drei Bausteine neben dem Unterricht."
  body: "Sprachen werden bei uns nicht nur gelernt, sondern angewendet — innerhalb und außerhalb des Klassenraums."
  pillars:
    - title: "Sprechen, Schreiben, Auftreten"
      body: "Eigene Texte, Präsentationen, szenische Übungen. Sprache wird aktiv geübt, nicht nur abgefragt."
    - title: "Erasmus+ und Partnerschulen"
      body: "Begegnungen mit unserer französischen Partnerschule, dem Lycée Professionnel Léonard de Vinci, sowie weiteren europäischen Schulen."
    - title: "Internationale Studienfahrten"
      body: "Im Profil unserer UNESCO-Schule unter anderem zum UNESCO-Hauptsitz in Paris und zu Partnerschulen im Baltikum."

advantages:
  eyebrow: "Auf einen Blick"
  title: "Was unser Sprachenkonzept ausmacht."
  list:
    - "Englisch durchgängig von Klasse 5 bis zum Abitur"
    - "2. Fremdsprache (Französisch oder Latein) ab Klasse 7"
    - "3. Fremdsprache (Französisch nach Latein) ab Klasse 9 möglich"
    - "Anfängerkurse Französisch und Latein auch in der Oberstufe"
    - "Latein-Latinum am Ende der Mittelstufe"

closing:
  eyebrow: "Persönlich kennenlernen"
  title: "Fragen zum"
  titleHighlight: "Sprachenangebot?"
  body: "Am Tag der offenen Tür sprechen Sie direkt mit den Lehrkräften und sehen den Unterricht in den Sprachräumen. Oder Sie vereinbaren ein Beratungsgespräch — das Sekretariat vermittelt."
  ctaLabel: "Tag der offenen Tür"
  ctaHref: "Tag-der-offenen-Tuer.html"
